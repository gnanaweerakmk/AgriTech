services:
  database:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: agritech
      POSTGRES_PASSWORD: local-database-password
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/database/001-payment.sql:/docker-entrypoint-initdb.d/001-payment.sql:ro
      - ./infra/database/002-regional-demand.sql:/docker-entrypoint-initdb.d/002-regional-demand.sql:ro
      - ./infra/database/003-leasing.sql:/docker-entrypoint-initdb.d/003-leasing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agritech -d agritech"]
      interval: 3s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak:/opt/keycloak/data
      - ./infra/keycloak/agritech-realm.json:/opt/keycloak/data/import/agritech-realm.json:ro
      - ./infra/keycloak/themes/agritech:/opt/keycloak/themes/agritech:ro

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgres://agritech:local-database-password@database:5432/agritech?sslmode=disable
      KEYCLOAK_ISSUER: http://localhost:8080/realms/agritech
      KEYCLOAK_INTERNAL_REALM: http://keycloak:8080/realms/agritech
      KEYCLOAK_API_SECRET: local-api-client
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  database:
  keycloak:
